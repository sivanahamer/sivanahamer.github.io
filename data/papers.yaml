  - id: 2023HamerStudents
    title: "Students' perceptions' of integrating a contribution measurement tool in software engineering projects"
    link: "https://ieeexplore.ieee.org/document/10229405"
    authors:
      - "SH"
      - "CQL"
      - "MJ"
    year: 2023
    venue: "CSEE&T"
    keywords:
      - "measurement tool"
      - "code contributions"
      - "assessment"
      - "empirical software engineering"
      - "software engineering education"
    isSlides: true
    material: "https://zenodo.org/records/8075646"
    abstract: >-
      Measuring developers' and teams' contributions in project-based software engineering courses is challenging. Instructors require measurement tools to identify early improvement opportunities and simplify the assessment of students' contributions to projects. Besides, students could appreciate detailed, timely, and valuable feedback that encapsulates the multi-faceted nature of their contribution to improve their skills. With the rise of software repositories, data-driven tools that mine and visualize repository data have been proposed to help assess and improve software engineering courses. Still, little is known about students' perceptions of integrating these tools to measure project contributions. This paper analyzes students' perceptions of integrating a contribution measurement tool in agile software engineering projects. We collected the perceptions of 65 undergraduate students developing projects through a mixed-method approach. Our results show several benefits of using these tools in software engineering courses, providing valuable feedback, intending to use such tools in projects, and facilitating timely and helpful feedback. Additionally, students described the benefits of nine agile practices, including coding standards, reviews and inspections, and planning games. These tools were perceived as useful, easy to use, and intended to be used in future projects. Six challenges for integrating these tools in a course setting related to adoption, learning curves, configuration issues, measurement completeness, team dynamics, and Goodhart's law were found. Our results showed the acceptance and utility of such tools to aid students in software engineering projects.
    files:
      slides: "/files/slides/2023HamerStudents.pdf"
  - id: 2023KulhmannSoftware
    title: "Software Visualization using the City Metaphor: Students' Perceptions and Experiences"
    link: "https://ieeexplore.ieee.org/abstract/document/10346099"
    authors:
      - "EK"
      - "SH"
      - "CQL"
    year: 2023
    venue: "CLEI"
    keywords:
      - "measurement tool"
      - "code contributions"
      - "assessment"
      - "empirical software engineering"
      - "software engineering education"
    abstract: >-
      Software visualization is a program comprehension technique that can support activities such as the analysis of the quality during the evolution of development. The empirical evaluation of software visualizations is necessary to provide evidence of perceptions and experiences of use, and the benefits provided during software analysis. Empirical data can help evidence the advantages and limitations of software visualizations, improving their acceptance in academia and industry. This study presents an analysis of the perceptions of 16 participants using a 3D city metaphor visualization to understand the structure of a web application and identify aspects related to development and quality best practices in a software engineering university course. For this, we studied the user experience through the UE Questionnaire (UEQ) and the ease of use, the perceived usefulness, and the intention of future use through the Technology Acceptance Model (TAM). Finally, benefits and opportunities were identified based on the perceptions of the participants and the results of the activity. The results indicate that the visualization of the city can support comprehension activities and help identify improvements in development and quality practices. Furthermore, this tool was positively perceived in the context of software engineering courses. Most of the acceptance and experience constructs were evaluated positively, with some opportunities identified regarding ease of use and visualization comprehension. In general, the visualization helped identify possible opportunities required for software applications under review.
    files: {}
  - id: 2024HamerJust
    title: "Just another copy and paste? Comparing the security vulnerabilities of ChatGPT generated code and StackOverflow answers"
    link: "https://ieeexplore.ieee.org/abstract/document/10579524"
    authors:
      - "SH"
      - "LW"
      - "MD"
    year: 2024
    venue: "DLSP"
    keywords:
      - "software engineering security"
      - "empirical study"
      - "large language models"
      - "software supply chain"
      - "code generation"
    isSlides: true
    material: "https://zenodo.org/records/10806611"
    abstract: >-
      Sonatype's 2023 report found that 97% of developers and security leads integrate generative Artificial Intelligence (AI), particularly Large Language Models (LLMs), into their development process. Concerns about the security implications of this trend have been raised. Developers are now weighing the benefits and risks of LLMs against other relied-upon information sources, such as StackOverflow (SO), requiring empirical data to inform their choice. In this work, our goal is to raise software developers’ awareness of the security implications when selecting code snippets by empirically comparing the vulnerabilities of ChatGPT and StackOverflow. To achieve this, we used an existing Java dataset from SO with security-related questions and answers. Then, we asked ChatGPT the same SO questions, gathering the generated code for comparison. After curating the dataset, we analyzed the number and types of Common Weakness Enumeration (CWE) vulnerabilities of 108 snippets from each platform using CodeQL. ChatGPT-generated code contained 248 vulnerabilities compared to the 302 vulnerabilities found in SO snippets, producing 20% fewer vulnerabilities with a statistically significant difference. Additionally, ChatGPT generated 19 types of CWE, fewer than the 22 found in SO. Our findings suggest developers are undereducated on insecure code propagation from both platforms, as we found 274 unique vulnerabilities and 25 types of CWE. Any code copied and pasted, created by AI or humans, cannot be trusted blindly, requiring good software engineering practices to reduce risk. Future work can help minimize insecure code propagation from any platform.
    files:
      slides: "/files/slides/2024HamerJust.pdf"
  - id: 2024QuesadaExploring
    title: "Exploring Students' Behaviors and Perceptions in Continuous Measurement of Software Projects"
    link: "https://ieeexplore.ieee.org/document/10700134"
    authors:
      - "CQL"
      - "SH"
      - "MJ"
    year: 2024
    venue: "CLEI"
    abstract: >-
      Continuous software engineering is increasingly ingrained and widely adopted in development projects. These projects have extended their processes by utilizing software measurement tools with dashboards to monitor and understand development best practices, quality, and evolution. Exploring development perceptions and behaviors in software engineering education and training contexts is needed to better understand how tools could aid development processes. The goal is to explore students’ perceptions and development behaviors in software engineering projects that continuously measure contributions. We conducted a case study, mainly focusing on agile software engineering and quality best practices, and gathered behaviors and perceptions through mining repositories and applying surveys. Our results show acceptance of continuous measurement, where most respondents agreed that it benefited their software development process. We found benefits in engineering and quality practices such as continuous integration and configuration management. Some of the perceived benefits related to agile practices did not always align with observed behaviors. Our results suggest that continuous measurement in software engineering education had mostly positive perceptions and outlooks on behaviors. These findings are encouraging for adopters of continuous measurement tools in education and training contexts. 
    files: {}
  - id: 2025HamerTrusting
    title: "Trusting code in the wild: Exploring contributor reputation measures to review dependencies in the Rust ecosystem"
    link: "https://doi.ieeecomputersociety.org/10.1109/TSE.2025.3551664"
    authors:
      - "SH"
      - "NI"
      - "MT"
      - "PS"
      - "LW"
    year: 2025
    venue: "TSE"
    material: "https://zenodo.org/records/15015121"
    abstract: >-
      Developers rely on open-source packages and must review dependencies to safeguard against vulnerable or malicious upstream code. A careful review of all dependencies changes often does not occur in practice. Therefore, developers need signals to inform of dependency changes that require additional examination, particularly measures for contributor reputation. The goal of this study is to help developers prioritize dependency review efforts by analyzing contributor reputation measures as a signal in the Rust ecosystem. We use network centrality measures to proxy contributor reputation using collaboration activity. We employ a mixed method methodology from the top 1,644 packages in the Rust ecosystem to build a network of 6,949 developers, survey 285 developers, and model 5 centrality measures. Through our survey, we find that only 24% of respondents often review dependencies before adding or updating a package, mentioning difficulties in the review process and signals are therefore employed. Particularly, 51% of respondents often consider contributor reputation when reviewing dependencies. We further explore contributor reputation through network centrality measures employing multivariate mixed-effect linear regression models. We find that the closeness centrality measure is a significant factor in explaining how developers choose to review dependencies. Yet, centrality measures alone do not account for how developers choose to review dependencies. We recommend the Rust ecosystem implement a contributor reputation badge based on our modeled coefficients to complement developers' dependency review efforts.
    files: {}
