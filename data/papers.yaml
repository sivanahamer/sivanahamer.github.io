  - id: 2025WilliamsRising
    title: "Can the Rising Tide of Software Supply Chain Attacks Raise All Software Engineering Boats?"
    link: "https://dl.acm.org/doi/10.1145/3696630.3734200"
    authors:
      - "LW"
      - "SH"
      - "NZ"
    year: 2025
    venue: "FSE"
    abstract: >-
      Software organizations largely did not anticipate how the software supply chain (SSC) would become a deliberate attack vector. Attackers have moved from finding and exploiting vulnerabilities contributed by well-intentioned developers, such as log4j, to a new generation of software supply chain attacks, aggressively implanting vulnerabilities directly into dependencies available in open source. As with SolarWinds, adversaries also find their way into builds and deployments to deploy rogue software. Once implanted, these vulnerabilities become an efficient attack vector for adversaries to gain leverage at scale by exploiting the software supply chain. Software supply chain attacks have increased exponentially since 2020. These attacks have heightened awareness among governments and software organizations worldwide of the need for software development teams to adopt good software security practices - and, in the process, good software engineering practices. This awareness has led to two US Executive Orders, the EU Cyber Resilience Act, and other actions worldwide. For example, the CEOs of software organizations who sell to the US government now need to sign a document attesting that good software security/engineering practices were used. This paper will share an overview of these actions, empirical observations in the state-of-practice in software security practice adoption, automated software practice measurement, and how these efforts can move into general software engineering.
    files: {}
  - id: 2026HamerClosing
    title: "Closing the Chain: How to reduce your risk of being SolarWinds, Log4j, or XZ Utils"
    link: "https://arxiv.org/abs/2503.12192"
    authors:
      - "SH"
      - "JB"
      - "NH"
      - "RH"
      - "CM"
      - "LW"
    year: 2026
    material: "https://zenodo.org/records/17546880"
    venue: "ICSE"
    abstract: >-
      Software supply chain frameworks, such as the US NIST Secure Software Development Framework (SSDF), detail what tasks software development organizations are recommended or mandated to adopt to reduce security risk. However, to further reduce the risk of similar attacks occurring, software organizations benefit from knowing what tasks mitigate attack techniques the attackers are currently using to address specific threats, prioritize tasks, and close mitigation gaps. The goal of this study is to aid software organizations in reducing the risk of software supply chain attacks by systematically synthesizing how framework tasks mitigate the attack techniques used in the SolarWinds, Log4j, and XZ Utils attacks. We qualitatively analyzed 106 Cyber Threat Intelligence (CTI) reports of the 3 attacks to gather the attack techniques. We then systematically constructed a mapping between attack techniques and the 73 tasks enumerated in 10 software supply chain frameworks. Afterward, we established and ranked priority tasks that mitigate attack techniques. The three mitigation tasks with the highest scores are role-based access control, system monitoring, and boundary protection. Additionally, three mitigation tasks were missing from all ten frameworks, including sustainable open-source software and environmental scanning tools. Thus, software products would still be vulnerable to software supply chain attacks even if organizations adopted all recommended tasks.
    files:
      slides: "/files/slides/2026HamerClosing.pdf"
  - id: 2026HamerTowards
    title: "Towards a Software Supply Chain Security Barometer: A Model to Assess and Guide Community Efforts"
    authors:
      - "SH"
    year: 2026
    venue: "ICSE-DS"
    abstract: >-
      Despite worldwide efforts across communities invested in software supply chain security, vulnerabilities continue to rise. Although more resources can be invested, a sustainable long-term solution would be to develop a model to assess the state of software supply chain security, guiding community efforts and direction. The goal of this dissertation proposal is to aid the software supply chain community in assessing and guiding organizational and ecosystem efforts by developing a barometer model of software supply chain security. We develop a barometer model to systematize the relationships between software security task adoption and security outcomes, providing feedback loops between both. The barometer model guides software organizations in prioritizing the adoption of software security tasks and policymakers in proposing data-driven efforts to improve software supply chain security.
    files:
      slides: "/files/posters/2026HamerTowards.pdf"